<div class="home-wrapper">
  <header class="home-header glass-panel">
    <h2>Music Discs Search</h2>
    <div class="header-actions">
      <button class="nav-btn" (click)="signOut()">Sign Out</button>
    </div>
  </header>

  <main class="home-content">
    <div class="search-section glass-panel">
      
      <div class="search-input-wrapper">
        <input 
          type="text" 
          [formControl]="searchControl" 
          placeholder="Search for an album / disc..." 
          class="search-input"
        >
        <span class="search-icon">🔍</span>
      </div>

      <!-- Recent Queries -->
      <div class="recent-queries" *ngIf="recentQueries().length > 0">
        <h4>Recent Searches:</h4>
        <div class="pills-container">
          <button 
            class="query-pill" 
            *ngFor="let query of recentQueries()" 
            (click)="onRecentQueryClick(query)">
            {{query}}
          </button>
        </div>
      </div>
      
    </div>

    <!-- Results Section with Virtual Scrolling -->
    <div class="results-section">
      <!-- Premium Skeleton Loader -->
      <div class="skeleton-container" *ngIf="isLoading()" style="display:flex; flex-direction:column; gap:1rem; padding-bottom: 2rem;">
        <div class="glass-panel" *ngFor="let i of [1,2,3,4,5]" style="display: flex; align-items: center; gap: 1.5rem; padding: 1rem; pointer-events: none; width: 100%;">
          <div class="skeleton skeleton-img"></div>
          <div style="display: flex; flex-direction: column; gap: 5px; flex: 1;">
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
          </div>
        </div>
      </div>

      <div class="empty-state" *ngIf="!isLoading() && searchControl.value && searchResults().length === 0">
        <p>No discs found matching "{{searchControl.value}}". Try another search!</p>
      </div>

      <div class="empty-state" *ngIf="!isLoading() && !searchControl.value">
        <p>Start typing above to search the Disc API.</p>
      </div>

      <cdk-virtual-scroll-viewport 
        itemSize="120" 
        class="virtual-scroll-viewport" 
        *ngIf="!isLoading() && searchResults().length > 0"
        (scrolledIndexChange)="onScroll($event)">
        
        <app-disc-card 
          *cdkVirtualFor="let disc of searchResults()" 
          [disc]="disc"
          (discClick)="onDiscClick($event)">
        </app-disc-card>
        
        <!-- Bottom Loader for Infinite Scroll -->
        <div class="bottom-loader" *ngIf="isFetchingMore()" style="text-align: center; padding: 1rem; color: var(--spotify-green);">
          Loading more items...
        </div>

      </cdk-virtual-scroll-viewport>
    </div>
  </main>
</div>
