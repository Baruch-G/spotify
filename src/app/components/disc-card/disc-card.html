<div class="card glass-panel" (click)="onClick()" *ngIf="disc">
  <div style="position: relative; width: 80px; height: 80px; flex-shrink: 0;" *ngIf="disc.images.length">
    <div class="skeleton" *ngIf="!imageLoaded" style="width: 100%; height: 100%; border-radius: 8px; position: absolute; z-index: 5;"></div>
    <img [src]="disc.images[0]?.url" 
         [alt]="disc.name" 
         class="card-img" 
         (load)="imageLoaded = true"
         [style.opacity]="imageLoaded ? 1 : 0"
         style="transition: opacity 0.4s ease; position: relative; z-index: 10;">
  </div>
  <div class="card-info">
    <h4>{{disc.name}}</h4>
    <p class="release-date">Released: {{disc.release_date}}</p>
  </div>
  <button class="heart-btn" [class.liked]="isLiked" (click)="onToggleHeart($event)">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </button>
</div>
